<!DOCTYPE html>

<!--
  This is your link page: your name, a line about you, and a button for each place people can find you.
  Everything on it is a placeholder until you change it.

  The easy way to change it: open this app in Tofu's builder and say what you want, for example
  "Change the name to Mike, the line to 'Baker at the corner bakery', and add a button for my Facebook page".

  Or change it by hand, here in this file:
  - Your name: replace "Your Name" in <title> and in <h1>.
  - The line about you: replace the words in the <p> under your name.
  - Your picture: put your photo in the images folder, then change src="images/avatar.svg" below to its name.
  - The buttons: each button is one line that starts with <a class="button. Change href="..." to your own
    address and the words just before </a> to what the button should say. Delete the lines you don't need.
  - More buttons: BUTTONS.md lists every button LittleLink comes with (Facebook, WhatsApp, Spotify, TikTok
    and over a hundred more), each one a line ready to copy in here.
  - Light or dark: change class="theme-auto" on the <html> line to theme-light or theme-dark.
-->

<html class="theme-auto" lang="en">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Your name (what shows on the browser tab and in search results) -->
    <title>Your Name</title>
    <link rel="icon" type="image/png" href="images/avatar.png">

    <!-- One sentence about you, shown in search results and when someone shares your page -->
    <meta name="description" content="Links to everywhere you can find me.">
    <meta name="author" content="Your Name">

    <!-- Browser UI Color - Matches the default light/dark theme backgrounds -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">

    <!-- Font Preloads - Lets the browser fetch fonts in parallel with the stylesheets -->
    <link rel="preload" href="fonts/open-sans-v34-vietnamese_latin-ext_latin_hebrew_greek-ext_greek_cyrillic-ext_cyrillic-regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/open-sans-v34-vietnamese_latin-ext_latin_hebrew_greek-ext_greek_cyrillic-ext_cyrillic-700.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/open-sans-v34-vietnamese_latin-ext_latin_hebrew_greek-ext_greek_cyrillic-ext_cyrillic-800.woff2" as="font" type="font/woff2" crossorigin>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/brands.css">

  </head>

<body>

    <div class="container">
        <div class="column">
          <main>

            <!-- Your picture: avatar--rounded makes it a circle, avatar--soft gives it slightly rounded corners, avatar--none keeps it square -->
            <img class="avatar avatar--rounded" src="images/avatar.svg" alt="Your Name" width="128" height="128" fetchpriority="high">

            <!-- Your name -->
            <h1>Your Name</h1>

            <!-- A short line about you -->
            <p>A short line about you goes here: what you do, or what people will find below.</p>

            <!-- Your buttons, top to bottom -->
            <nav class="button-stack" aria-label="Links">

              <!-- Website: change https://example.com to your own website -->
              <a class="button button-default" href="https://example.com" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/generic-website.svg" alt="Website Icon">My website</a>

              <!-- Email: change you@example.com to your own email address, keeping mailto: in front of it -->
              <a class="button button-default" href="mailto:you@example.com"><img class="icon" aria-hidden="true" src="images/icons/generic-email.svg" alt="Email Icon">Email me</a>

              <!-- Instagram: add your Instagram name after instagram.com/ -->
              <a class="button button-instagram" href="https://www.instagram.com/" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/instagram.svg" alt="Instagram Logo">Instagram</a>

              <!-- YouTube: change it to your channel's address -->
              <a class="button button-yt" href="https://www.youtube.com/" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/youtube.svg" alt="YouTube Logo">YouTube</a>

              <!-- TikTok: add your TikTok name after tiktok.com/ -->
              <a class="button button-tiktok" href="https://www.tiktok.com/" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/tiktok.svg" alt="TikTok Logo">TikTok</a>

            </nav>
          </main>

      <footer>
        <a href="privacy.html">Privacy Policy</a> | Build your own by forking <a href="https://littlelink.io" target="_blank" rel="noopener">LittleLink</a>
      </footer>

    </div>
  </div>

</body>

</html>
